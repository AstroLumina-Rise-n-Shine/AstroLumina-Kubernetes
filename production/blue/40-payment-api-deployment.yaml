apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api-blue
  namespace: astrolumina-production
  # Let the Doppler operator restart the pods automatically when a synced secret changes.
  annotations:
    secrets.doppler.com/reload: "true"
  labels:
    app.kubernetes.io/name: payment-api
    app.kubernetes.io/part-of: astrolumina
    app.kubernetes.io/component: payment-api
    environment: production
    variant: blue
spec:
  # 3 replicas to mirror the Compose production blue service.
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-api
      app.kubernetes.io/component: payment-api
      variant: blue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-api
        app.kubernetes.io/part-of: astrolumina
        app.kubernetes.io/component: payment-api
        environment: production
        variant: blue
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      # Baseline hardening: default seccomp profile for every container.
      # Run as the image's unprivileged user (nodejs 1001 / nginx 101).
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      # Blue runs on worker-01, green on worker-02 (see README): together
      # with the CP taint this keeps app pods off the control plane.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - rke2-worker-daniel-pirvu-01
      # Writable scratch on a read-only root filesystem (emptyDir).
      volumes:
        - name: tmp-vol
          emptyDir: {}
      containers:
        - name: payment-api
          image: ghcr.io/astrolumina-rise-n-shine/astrolumina-paymentapi:2.0.19
          imagePullPolicy: Always
          # Baseline hardening: no privilege escalation, no Linux capabilities.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # Read-only root filesystem; writable scratch comes from the
            # emptyDir volumes at pod level (pid/logs/cache for nginx, /tmp for node).
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp-vol
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 3032
              protocol: TCP
          # Full variable set from src/config/env.ts (the app exits at startup
          # if any required variable is missing; PORT alone is not read).
          env:
            - name: NODE_ENV
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: NODE_ENV
            - name: PAYMENT_API_SERVER_PORT
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: PAYMENT_API_SERVER_PORT
            - name: PAYMENT_API_SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: PAYMENT_API_SENTRY_DSN
            - name: CORS_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: CORS_ORIGINS
                  optional: true
            - name: REVOLUT_PAY_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: REVOLUT_PAY_SECRET_KEY
            - name: REVOLUT_PAY_API_VERSION
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: REVOLUT_PAY_API_VERSION
            - name: ASTROLOGY_API_SERVER_DC_PORT
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: ASTROLOGY_API_SERVER_DC_PORT
            - name: ASTROLOGY_API_SERVER_DC_DNS
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: ASTROLOGY_API_SERVER_DC_DNS
            - name: ASTROLOGY_API_SERVER_K8S_PORT
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: ASTROLOGY_API_SERVER_K8S_PORT
            - name: ASTROLOGY_API_SERVER_K8S_DNS
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: ASTROLOGY_API_SERVER_K8S_DNS
            - name: BOOKING_API_SERVER_DC_PORT
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: BOOKING_API_SERVER_DC_PORT
            - name: BOOKING_API_SERVER_DC_DNS
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: BOOKING_API_SERVER_DC_DNS
            - name: BOOKING_API_SERVER_K8S_PORT
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: BOOKING_API_SERVER_K8S_PORT
            - name: BOOKING_API_SERVER_K8S_DNS
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: BOOKING_API_SERVER_K8S_DNS
            - name: PAYMENT_API_SERVER_DC_PORT
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: PAYMENT_API_SERVER_DC_PORT
            - name: PAYMENT_API_SERVER_DC_DNS
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: PAYMENT_API_SERVER_DC_DNS
            - name: PAYMENT_API_SERVER_K8S_PORT
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: PAYMENT_API_SERVER_K8S_PORT
            - name: PAYMENT_API_SERVER_K8S_DNS
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: PAYMENT_API_SERVER_K8S_DNS
            - name: FRONTEND_SERVER_DC_PORT
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: FRONTEND_SERVER_DC_PORT
            - name: FRONTEND_SERVER_DC_DNS
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: FRONTEND_SERVER_DC_DNS
            - name: FRONTEND_SERVER_K8S_PORT
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: FRONTEND_SERVER_K8S_PORT
            - name: FRONTEND_SERVER_K8S_DNS
              valueFrom:
                secretKeyRef:
                  name: env-payment-api-secrets
                  key: FRONTEND_SERVER_K8S_DNS
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 2
      restartPolicy: Always
