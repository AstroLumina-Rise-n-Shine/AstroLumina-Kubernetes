apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-blue
  namespace: astrolumina-production
  # Let the Doppler operator restart the pods automatically when a synced secret changes.
  annotations:
    secrets.doppler.com/reload: "true"
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: astrolumina
    app.kubernetes.io/component: frontend
    environment: production
    variant: blue
spec:
  # 3 replicas to mirror the Compose production blue service.
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/component: frontend
      variant: blue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: astrolumina
        app.kubernetes.io/component: frontend
        environment: production
        variant: blue
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      # Baseline hardening: default seccomp profile for every container.
      # Run as the image's unprivileged user (nodejs 1001 / nginx 101).
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        # The html emptyDir is seeded and rewritten by UID/GID 101. Let the
        # kubelet hand it to the pod's group instead of relying on the
        # world-writable emptyDir default; OnRootMismatch avoids a recursive
        # chown on every restart.
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      # Blue runs on worker-01, green on worker-02 (see README): together
      # with the CP taint this keeps app pods off the control plane.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - rke2-worker-daniel-pirvu-01
      # Writable scratch on a read-only root filesystem (emptyDir).
      volumes:
        # Writable copy of /usr/share/nginx/html: the image entrypoint
        # rewrites env.js and index.html with sed -i at startup, so that
        # directory must stay writable even with a read-only root filesystem.
        - name: frontend-html
          emptyDir: {}
        - name: tmp-vol
          emptyDir: {}
        - name: nginx-logs
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
      # Seed the writable html volume from the image before the main container
      # starts. Runs as the same unprivileged nginx user; no entrypoint, no
      # network. The main container then applies its runtime sed -i to this
      # copy while the rest of its root filesystem stays immutable.
      initContainers:
        - name: init-frontend-html
          image: ghcr.io/astrolumina-rise-n-shine/astrolumina-frontend:2.0.24
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - cp -R /usr/share/nginx/html/. /frontend-html/
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
          volumeMounts:
            - name: frontend-html
              mountPath: /frontend-html
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: frontend
          image: ghcr.io/astrolumina-rise-n-shine/astrolumina-frontend:2.0.24
          imagePullPolicy: Always
          # Baseline hardening: no privilege escalation, no Linux capabilities.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # The root filesystem is immutable. The entrypoint's sed -i
            # rewrites env.js/index.html on the writable emptyDir mounted at
            # /usr/share/nginx/html (seeded by the init container).
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: frontend-html
              mountPath: /usr/share/nginx/html
            - name: tmp-vol
              mountPath: /tmp
            - name: nginx-logs
              mountPath: /var/log/nginx
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # The image entrypoint injects these Compose-style variables into
          # public/env.js at container start. VITE_* names are NOT read.
          env:
            - name: NODE_ENV
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: NODE_ENV
            - name: FRONTEND_SERVER_PORT
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: FRONTEND_SERVER_PORT
            - name: FRONTEND_SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: FRONTEND_SENTRY_DSN
            - name: REVOLUT_PAY_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: REVOLUT_PAY_PUBLIC_KEY
            - name: R2_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: R2_BASE_URL
            - name: ASTROLOGY_API_URL
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: ASTROLOGY_API_K8S_URL
            - name: PAYMENT_API_URL
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: PAYMENT_API_K8S_URL
            - name: BOOKING_API_URL
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: BOOKING_API_K8S_URL
            - name: ASTROLOGY_API_SERVER_DC_PORT
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: ASTROLOGY_API_SERVER_DC_PORT
            - name: ASTROLOGY_API_SERVER_DC_DNS
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: ASTROLOGY_API_SERVER_DC_DNS
            - name: ASTROLOGY_API_SERVER_K8S_PORT
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: ASTROLOGY_API_SERVER_K8S_PORT
            - name: ASTROLOGY_API_SERVER_K8S_DNS
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: ASTROLOGY_API_SERVER_K8S_DNS
            - name: BOOKING_API_SERVER_DC_PORT
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: BOOKING_API_SERVER_DC_PORT
            - name: BOOKING_API_SERVER_DC_DNS
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: BOOKING_API_SERVER_DC_DNS
            - name: BOOKING_API_SERVER_K8S_PORT
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: BOOKING_API_SERVER_K8S_PORT
            - name: BOOKING_API_SERVER_K8S_DNS
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: BOOKING_API_SERVER_K8S_DNS
            - name: PAYMENT_API_SERVER_DC_PORT
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: PAYMENT_API_SERVER_DC_PORT
            - name: PAYMENT_API_SERVER_DC_DNS
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: PAYMENT_API_SERVER_DC_DNS
            - name: PAYMENT_API_SERVER_K8S_PORT
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: PAYMENT_API_SERVER_K8S_PORT
            - name: PAYMENT_API_SERVER_K8S_DNS
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: PAYMENT_API_SERVER_K8S_DNS
            - name: FRONTEND_SERVER_DC_PORT
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: FRONTEND_SERVER_DC_PORT
            - name: FRONTEND_SERVER_DC_DNS
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: FRONTEND_SERVER_DC_DNS
            - name: FRONTEND_SERVER_K8S_PORT
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: FRONTEND_SERVER_K8S_PORT
            - name: FRONTEND_SERVER_K8S_DNS
              valueFrom:
                secretKeyRef:
                  name: env-frontend-secrets
                  key: FRONTEND_SERVER_K8S_DNS
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 2
        # nginx-prometheus-exporter sidecar: turns Nginx stub_status into
        # Prometheus metrics (nginx_http_requests_total, connections) on
        # :9113 — scraped via the frontend-live Service metrics port.
        - name: nginx-metrics
          image: docker.io/nginx/nginx-prometheus-exporter:1.5.3
          imagePullPolicy: IfNotPresent
          args:
            - -nginx.scrape-uri=http://127.0.0.1:8080/stub_status
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: metrics
              containerPort: 9113
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      restartPolicy: Always
